<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CodeViz · 星核锻造 Starforge</title>
<style>
:root{
  --ink:#dfe7f6; --dim:#8fa0bf; --faint:#5d6c8c;
  --green:#2ee6a8; --amber:#ffc65c; --red:#ff6b6b; --pend:#6b7d9e;
  --line:rgba(130,152,200,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden;background:#04060b}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink)}
#stage{position:relative;width:1600px;height:900px;isolation:isolate}
#scene{position:absolute;inset:0;display:block;z-index:2}
.depth-layer{position:absolute;inset:-55px;pointer-events:none;overflow:hidden;will-change:transform}
.depth-far{z-index:0;background:
  radial-gradient(ellipse at 34% 44%,rgba(20,121,129,.10),transparent 38%),
  radial-gradient(ellipse at 72% 42%,rgba(98,71,155,.10),transparent 34%)}
.depth-far i{position:absolute;width:520px;height:270px;border-radius:50%;filter:blur(55px);
  background:radial-gradient(ellipse,rgba(94,104,137,.13),transparent 68%);
  animation:forgeSmoke 32s ease-in-out infinite alternate}
.depth-far i:nth-child(2){animation-delay:-14s;animation-direction:alternate-reverse}
.depth-mid{z-index:1}
.depth-mid::before{content:"";position:absolute;left:575px;top:235px;width:450px;height:520px;border-radius:48%;
  background:radial-gradient(ellipse at 50% 62%,rgba(255,170,72,.18),rgba(255,112,28,.045) 42%,transparent 70%);
  filter:blur(18px);animation:forgeAmbient 8.4s ease-in-out infinite}
.depth-mid::after{content:"";position:absolute;left:675px;top:330px;width:250px;height:360px;
  background:repeating-radial-gradient(ellipse at 50% 100%,transparent 0 16px,rgba(255,211,143,.055) 18px 20px,transparent 22px 38px);
  filter:blur(2px);animation:heatRise 4.2s ease-in-out infinite}
.depth-near{z-index:3}
.depth-near b{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff3c9;
  box-shadow:0 0 12px 4px rgba(255,151,46,.45);animation:frontEmber 6s ease-out infinite;opacity:0}
@keyframes forgeSmoke{from{transform:translate(-70px,25px) scale(.9)}to{transform:translate(100px,-45px) scale(1.15)}}
@keyframes forgeAmbient{0%,28%,100%{opacity:.3;transform:scale(.9)}48%{opacity:.62;transform:scale(1.03)}
  53%{opacity:1;transform:scale(1.16)}68%{opacity:.4;transform:scale(1.28)}}
@keyframes heatRise{0%,100%{transform:translateY(20px) scaleX(.92);opacity:.18}50%{transform:translateY(-22px) scaleX(1.08);opacity:.48}}
@keyframes frontEmber{0%{transform:translate(0,100px) scale(.5);opacity:0}16%{opacity:.75}
  100%{transform:translate(var(--ex,80px),-540px) scale(2.3);opacity:0}}
/* ---------- svg animation utilities ---------- */
.tb{transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.rotA{animation:rot var(--rd,60s) linear infinite}
.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:var(--dd,-160)}}
.flow{animation:flow var(--fd,6s) linear infinite}
@keyframes breathe{0%,100%{opacity:var(--o1,.5);transform:scale(1)}50%{opacity:var(--o2,.9);transform:scale(1.05)}}
.breathe{animation:breathe var(--bd,3.6s) ease-in-out infinite}
@keyframes bobk{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--bb,-3.5px))}}
.bob{animation:bobk var(--bt,6s) ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.2}50%{opacity:.85}}
.twinkA{animation:twk 4.6s ease-in-out infinite}
.twinkB{animation:twk 4.6s ease-in-out -1.5s infinite}
.twinkC{animation:twk 4.6s ease-in-out -3s infinite}
@keyframes nebd{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-15px)}}
.neb{animation:nebd var(--nd,80s) ease-in-out infinite}
/* forge core */
@keyframes corebreath{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.corebreath{animation:corebreath 3.4s ease-in-out infinite}
@keyframes poolpulse{0%,100%{opacity:.88}50%{opacity:1}}
.poolpulse{animation:poolpulse 3.2s ease-in-out infinite}
@keyframes colflick{0%,100%{opacity:.32}18%{opacity:.44}37%{opacity:.28}55%{opacity:.46}76%{opacity:.36}}
.colflick{animation:colflick 2.8s linear infinite}
@keyframes crackfk{0%,100%{opacity:.55}45%{opacity:.95}60%{opacity:.7}}
.crackfk{animation:crackfk 2.2s linear infinite}
@keyframes menisk{0%,100%{opacity:.55}50%{opacity:1}}
.menisk{animation:menisk 2.6s ease-in-out infinite}
/* grand forge event · 8.4s: gather → lift → strike → flare → settle */
@keyframes bigswing{
  0%,28%{transform:translateY(8px)}
  38%{transform:translateY(-34px)}
  46%{transform:translateY(-34px)}
  51%{transform:translateY(-8px)}
  53%{transform:translateY(34px)}
  56%{transform:translateY(34px)}
  64%{transform:translateY(5px)}
  100%{transform:translateY(8px)}
}
.bigswing{animation:bigswing 8.4s cubic-bezier(.42,0,.2,1) infinite}
@keyframes bigspark{0%,51.5%{opacity:0;transform:scale(.35) rotate(0)}53%{opacity:1;transform:scale(1) rotate(8deg)}57%{opacity:.75;transform:scale(1.65) rotate(22deg)}64%,100%{opacity:0;transform:scale(2.1) rotate(30deg)}}
.bigspark{animation:bigspark 8.4s cubic-bezier(.15,.65,.25,1) infinite}
@keyframes bigface{0%,48%{opacity:.24}51%{opacity:.6}53%{opacity:1}61%{opacity:.3}100%{opacity:.24}}
.bigface{animation:bigface 8.4s linear infinite}
@keyframes shock{0%,52%{opacity:0;transform:scale(.72)}53.5%{opacity:.9;transform:scale(.92)}65%{opacity:.2;transform:scale(1.65)}72%,100%{opacity:0;transform:scale(1.9)}}
.shock{animation:shock 8.4s cubic-bezier(.12,.58,.22,1) infinite}
@keyframes coreflash{0%,48%{opacity:0;transform:scale(.75)}53%{opacity:.82;transform:scale(1.08)}59%{opacity:.35;transform:scale(1.22)}70%,100%{opacity:0;transform:scale(1.42)}}
.coreflash{animation:coreflash 8.4s cubic-bezier(.12,.65,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes forgeCharge{0%,24%{opacity:0;transform:scale(.55)}36%{opacity:.35;transform:scale(.85)}48%{opacity:.82;transform:scale(1.04)}53%{opacity:1;transform:scale(1.12)}61%{opacity:.2;transform:scale(1.35)}72%,100%{opacity:0;transform:scale(1.5)}}
.forgeCharge{animation:forgeCharge 8.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes impactRay{0%,52%{opacity:0;transform:scale(.25) rotate(-8deg)}53.5%{opacity:1;transform:scale(1) rotate(0)}61%{opacity:.15;transform:scale(1.5) rotate(7deg)}68%,100%{opacity:0;transform:scale(1.8) rotate(10deg)}}
.impactRay{animation:impactRay 8.4s cubic-bezier(.1,.65,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes forgeShake{0%,52%,58%,100%{transform:translate(0,0)}53%{transform:translate(-2px,1px)}54%{transform:translate(2px,-1px)}55%{transform:translate(-1px,-1px)}56%{transform:translate(1px,1px)}}
#scene{animation:forgeShake 8.4s linear infinite}
/* mini hammer tap · 2.4s */
@keyframes tapspark{0%,45%{opacity:0;transform:scale(.4)}49%{opacity:1;transform:scale(1)}56%{opacity:.55;transform:scale(1.3)}62%{opacity:0}100%{opacity:0}}
.tapspark{animation:tapspark 2.4s linear infinite}
@keyframes tapface{0%,45%{opacity:.12}50%{opacity:.9}60%{opacity:.12}100%{opacity:.12}}
.tapface{animation:tapface 2.4s linear infinite}
@keyframes coreglowP{0%,44%{opacity:.72}49%{opacity:1}58%{opacity:.72}100%{opacity:.72}}
.coreglowP{animation:coreglowP 2.4s linear infinite}
@keyframes pendb{0%,100%{opacity:.5}50%{opacity:.66}}
.pendb{animation:pendb 7s ease-in-out infinite}
/* ember */
@keyframes emberk{0%{transform:translate(0,0);opacity:0}10%{opacity:var(--eo,.6)}80%{opacity:calc(var(--eo,.6)*.55)}100%{transform:translate(var(--ex,0),var(--ey,-200px));opacity:0}}
.ember{animation:emberk var(--ed,6s) linear infinite}
/* commit-pulse hit flash */
@keyframes hitr{0%{opacity:.95;transform:scale(.55)}100%{opacity:0;transform:scale(2.1)}}
.hitRing{opacity:0}
.node.hit .hitRing{animation:hitr .68s ease-out}
@keyframes hitb{0%{filter:brightness(2.1)}100%{filter:brightness(1)}}
.node.hit .anvilBody{animation:hitb .68s ease-out}
/* legend + misc */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.blinkDot{animation:blink 1.8s ease-in-out infinite}
@keyframes errfk{0%,100%{opacity:.95}42%{opacity:.5}48%{opacity:1}55%{opacity:.45}70%{opacity:.9}}
.errfk{animation:errfk 2.6s linear infinite}
@keyframes legp{0%,100%{opacity:.45}50%{opacity:1}}
.legp{animation:legp 1.6s ease-in-out infinite}
/* ---------- HTML overlays ---------- */
#topbar{position:absolute;left:0;top:0;width:1600px;height:58px;display:flex;align-items:center;
  padding:0 26px;gap:14px;z-index:6;
  background:linear-gradient(180deg,rgba(7,10,18,.92),rgba(7,10,18,.62) 78%,rgba(7,10,18,0));
  border-bottom:1px solid rgba(130,152,200,.13)}
.logoWrap{display:flex;align-items:center;gap:10px}
.wordmark{font-size:17px;font-weight:700;letter-spacing:.5px;color:#eef3ff}
.wordmark b{color:var(--amber);font-weight:700}
.tagPill{font-size:12px;color:#ffd98c;border:1px solid rgba(255,198,92,.38);background:rgba(255,158,60,.08);
  border-radius:999px;padding:3px 12px;letter-spacing:1px}
.tagPill i{font-style:normal;color:#c9a25c;margin-left:6px;letter-spacing:1.5px;font-size:10.5px}
.projectPill{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11px;color:#9fb0cd;letter-spacing:.4px}
#topbar .spacer{flex:1}
.chip{display:flex;align-items:center;gap:7px;font-size:12px;color:#c6d1e8;
  background:rgba(17,23,39,.72);border:1px solid rgba(130,152,200,.17);border-radius:999px;padding:4.5px 12px}
.chip b{font-size:13px;font-weight:700;color:#eef3ff}
.chip .dot{width:7px;height:7px;border-radius:50%}
.sep{width:1px;height:22px;background:rgba(130,152,200,.2);margin:0 2px}
.ringWrap{display:flex;align-items:center;gap:8px}
.ringLbl{display:flex;flex-direction:column;line-height:1.15}
.ringLbl .t{font-size:10px;color:var(--dim);letter-spacing:2px}
.ringLbl .v{font-size:15px;font-weight:700;color:#ffd98c}
.liveB{display:flex;align-items:center;gap:7px;font-size:12px;color:#9fe8cf;
  border:1px solid rgba(46,230,168,.3);background:rgba(46,230,168,.07);border-radius:999px;padding:4.5px 12px}
.liveB .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(46,230,168,.9)}
/* phase plaques */
#phaseDeck{position:absolute;left:26px;right:26px;top:72px;z-index:5;display:grid;
  grid-template-columns:repeat(var(--phase-cols,6),minmax(0,1fr));gap:8px;align-items:stretch}
.plaque{position:relative;min-width:0;padding:9px 11px 10px;border-radius:11px;
  background:linear-gradient(160deg,rgba(15,20,35,.88),rgba(9,13,24,.8));
  border:1px solid rgba(130,152,200,.2);box-shadow:0 6px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(180,200,255,.07)}
.plaque::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,#ffd98c,#8fa5d4)}
.pTag{font-size:9px;letter-spacing:2px;color:var(--faint);margin-bottom:2px;white-space:nowrap}
.pTitle{font-size:13px;font-weight:700;color:#e8eefc;letter-spacing:.2px;margin-bottom:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pBarRow{display:flex;align-items:center;gap:9px}
.pBar{flex:1;height:5px;border-radius:99px;background:#1b2336;display:flex;overflow:hidden}
.pBar i{height:100%}
.pNum{font-size:11px;font-weight:700;color:#ffd98c;white-space:nowrap}
.pSub{margin-top:5px;font-size:9.5px;color:var(--dim);letter-spacing:.15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* legend */
#legend{position:absolute;left:26px;bottom:22px;z-index:5;padding:12px 15px 11px;border-radius:12px;
  background:rgba(9,13,24,.8);border:1px solid rgba(130,152,200,.18);box-shadow:0 6px 30px rgba(0,0,0,.4)}
#legend .lt{font-size:10.5px;letter-spacing:3.5px;color:var(--faint);margin-bottom:8px}
.lrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#c3cee6;margin-top:5px}
.lrow svg{flex:none}
.lfoot{margin-top:9px;padding-top:8px;border-top:1px solid rgba(130,152,200,.14);
  font-size:11px;color:var(--faint);letter-spacing:.4px}
/* caption */
#caption{position:absolute;right:28px;bottom:26px;z-index:5;font-size:12.5px;color:#7e8dae;letter-spacing:.4px;text-align:right}
#caption b{color:#c9a25c;font-weight:600}
/* vignette */
#vig{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(115% 100% at 50% 44%,rgba(0,0,0,0) 52%,rgba(2,4,9,.6) 100%),
             linear-gradient(180deg,rgba(3,5,10,.42),transparent 12%,transparent 88%,rgba(2,4,9,.5))}
/* svg text */
text{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
.lid{font-size:13px;font-weight:640;letter-spacing:.4px;paint-order:stroke;stroke:rgba(4,7,13,.88);stroke-width:3px;stroke-linejoin:round}
.lname{font-size:12px;fill:#b9c5de;opacity:.94;paint-order:stroke;stroke:rgba(4,7,13,.88);stroke-width:3px;stroke-linejoin:round}
.statusWord{font-size:10.5px;font-weight:750;letter-spacing:.8px}
.statusPill{stroke-width:1.2}
.gaugeT{font-size:11.5px;fill:#ffd98c;opacity:.92;letter-spacing:1px;paint-order:stroke;stroke:rgba(4,7,13,.8);stroke-width:3px}
.ringTxt{font-size:13px;fill:#8fa5d4;letter-spacing:9px;opacity:.2}
.hamRune{font-size:12px;fill:#ffe3a8;opacity:.85}
body .cv-live-controls{top:auto!important;bottom:18px!important}
@media(max-width:1200px){
  .projectPill{display:none}
  .chip{padding-inline:8px}
}
</style>
</head>

<script>
'use strict';
/* ================= deterministic prng ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20260726);
const CX=800,CY=468;
function pt(aDeg,r){const a=aDeg*Math.PI/180;return [CX+r*Math.cos(a),CY-r*Math.sin(a)]}
function f1(n){return Math.round(n*10)/10}

/* ================= payload + file:// fallback ================= */
const FALLBACK_DATA={
  projectId:'starforge-demo',
  projectName:'静态锻造演示',
  phases:[
    {id:'phase-closeout',name:'Phase 15 · 阶段收敛',tasks:['T001','T002','T003','T004','T005','T006','T007']},
    {id:'phase-codeviz',name:'CodeViz · 验收',tasks:['T101','T102','T103']}],
  tasks:[
    {id:'T001',name:'梳理 Phase 15 closeout',status:'done',phase:'phase-closeout',depends:[],files:['plan.md']},
    {id:'T002',name:'收敛 script rewrite',status:'in-progress',phase:'phase-closeout',depends:['T001'],files:['rewrite.js']},
    {id:'T003',name:'补齐 pipeline fixtures',status:'in-progress',phase:'phase-closeout',depends:['T002'],files:['a.json','b.json']},

function esc(value){
  return String(value==null?'':value).replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function list(value){
  if(Array.isArray(value))return value.filter(v=>v!=null&&v!=='').map(v=>String(v));
  if(value==null||value==='')return[];
  return String(value).split(/[,\s，]+/).filter(Boolean);
}
function finite(value,fallback){
  const n=Number(value);return Number.isFinite(n)&&n>=0?n:fallback;
}
function normalizeStatus(value){
  const s=String(value||'pending').toLowerCase().replace(/_/g,'-');
  if(s==='done'||s==='completed'||s==='complete')return'done';
  if(s==='in-progress'||s==='inprogress'||s==='progress'||s==='active')return'in-progress';
  if(s==='error'||s==='failed'||s==='failure')return'error';
  return'pending';
}
function normalizePayload(input){
  const rawPhases=Array.isArray(input.phases)?input.phases:[];
  const phases=rawPhases.map((phase,index)=>({
    uid:`p${index}`,
    id:String(phase&&phase.id!=null?phase.id:`phase-${index+1}`),
    name:String(phase&&phase.name!=null?phase.name:`阶段 ${index+1}`),
    refs:Array.isArray(phase&&phase.tasks)?phase.tasks:[],
    tasks:[]}));
  const phaseLookup=new Map();
  phases.forEach(phase=>{
    if(!phaseLookup.has(phase.id))phaseLookup.set(phase.id,phase);
    if(!phaseLookup.has(phase.name))phaseLookup.set(phase.name,phase);
  });
  const membership=new Map();
  phases.forEach(phase=>phase.refs.forEach(ref=>{
    const id=ref&&typeof ref==='object'?ref.id:ref;
    if(id!=null&&!membership.has(String(id)))membership.set(String(id),phase);
  }));
  function ensurePhase(ref){
    const key=ref==null?'':String(ref);
    if(key&&phaseLookup.has(key))return phaseLookup.get(key);
    if(!key&&phases.length===1)return phases[0];
    const id=key||'phase-unassigned';
    const phase={uid:`p${phases.length}`,id,name:key||'未分配阶段',refs:[],tasks:[]};
    phases.push(phase);phaseLookup.set(id,phase);phaseLookup.set(phase.name,phase);
    return phase;
  }
  const rawTasks=Array.isArray(input.tasks)?input.tasks:[];
  const tasks=rawTasks.map((task,index)=>{
    const source=task&&typeof task==='object'?task:{name:task};
    const id=String(source.id!=null?source.id:`T${String(index+1).padStart(3,'0')}`);
    const phase=ensurePhase(source.phase!=null?source.phase:(membership.get(id)||{}).id);
    const files=list(source.files);
    const load=Math.max(1,Math.min(5,Math.round(finite(source.load,files.length||1))));
    const normalized={
      uid:`n${index}`,id,name:String(source.name!=null?source.name:id),
      st:normalizeStatus(source.status),phaseId:phase.id,phaseIndex:phases.indexOf(phase),
      depends:[...new Set(list(source.depends))],files,load,sourceIndex:index};
    phase.tasks.push(normalized);
    return normalized;
  });
  const computed={total:tasks.length,done:0,pending:0,inProgress:0,error:0};
  tasks.forEach(task=>{
    if(task.st==='done')computed.done++;
    else if(task.st==='in-progress')computed.inProgress++;
    else if(task.st==='error')computed.error++;
    else computed.pending++;
  });
  const supplied=input.stats&&typeof input.stats==='object'?input.stats:{};
  const stats={
    total:finite(supplied.total,computed.total),
    done:finite(supplied.done,computed.done),
    pending:finite(supplied.pending,computed.pending),
    inProgress:finite(supplied.inProgress,computed.inProgress),
    error:finite(supplied.error,computed.error)};
  phases.forEach((phase,index)=>{
    phase.index=index;
    phase.stats={total:phase.tasks.length,done:0,pending:0,inProgress:0,error:0};
    phase.tasks.forEach(task=>{
      task.phaseIndex=index;
      if(task.st==='done')phase.stats.done++;
      else if(task.st==='in-progress')phase.stats.inProgress++;
      else if(task.st==='error')phase.stats.error++;
      else phase.stats.pending++;
    });
  });
  return{
    projectId:String(input.projectId!=null?input.projectId:'starforge-project'),
    projectName:String(input.projectName!=null?input.projectName:'CodeViz 项目'),
    phases,tasks,stats};
}

      fill="none" stroke="${c.bright}" stroke-width="2.4" stroke-linecap="round" class="errfk"/>`;
  /* load pips */
  const pw=n.load*7-2,py=R*1.02+8;let pips='';
  for(let j=0;j<n.load;j++)pips+=`<rect x="${f1(-pw/2+j*7)}" y="${f1(py)}" width="5" height="2.6" rx="1.2" fill="${c.main}" opacity="${n.st==='pending'?.45:.8}"/>`;
  inner+=pips;
  /* mini forge hammer for progress */
  let dl=0;
  if(n.st==='in-progress'){
    dl=f1(0.2+tapIdx*0.53);tapIdx++;
    inner=inner.split('VAR_DL').join(`-${dl}s`);
    const hs=f1(Math.min(1.15,Math.max(.72,R/27)));
    inner+=`<g transform="translate(${f1(R*1.05)},${f1(-R*.62)}) scale(${hs})">
      <g><animateTransform attributeName="transform" type="rotate"
          values="36 0 0;36 0 0;-52 0 0;-52 0 0;36 0 0" keyTimes="0;0.4;0.47;0.53;1" dur="2.4s" begin="-${dl}s" repeatCount="indefinite"/>
        <circle cx="0" cy="2" r="2" fill="#cba26a"/>
        <rect x="-1.5" y="-24" width="3" height="26" rx="1.5" fill="#d8b87c"/>
        <path d="M -8,-31 L 8,-31 L 10,-21 L -10,-21 Z" fill="url(#miniHeadG)" stroke="rgba(40,28,10,.8)" stroke-width=".7"/>
        <path d="M -10,-21 L 10,-21 L 10,-18.6 L -10,-18.6 Z" fill="#ffe7b0" class="tapface" style="animation-delay:-${dl}s"/>
      </g></g>`;
    inner+=`<g class="tapspark tb" style="animation-delay:-${dl}s" transform="translate(${f1(R*.2)},${f1(-R*.72)}) scale(${hs})">
      <circle r="2.6" fill="#fff"/>
      <path d="M 0,0 l 0,-10 M 0,0 l 9,-5 M 0,0 l -9,-5 M 0,0 l 6,7 M 0,0 l -6,7" stroke="#ffe8bb" stroke-width="1.6" stroke-linecap="round" fill="none"/></g>`;
  }
  /* crystal and label share one task root, so every payload task is represented once. */
  const side=n.side==='L'?-1:1;
  const lx=f1(side*(R+16)),anchor=side<0?'end':'start';
  const pillCx=f1(lx+side*64),pillX=f1(pillCx-28);
  const visibleName=n.name.length>28?`${n.name.slice(0,27)}…`:n.name;
  NODE+=`<g id="node-${n.uid}" class="node task-node" data-task-id="${esc(n.id)}" data-status="${n.st}"
    data-phase-id="${esc(n.phaseId)}" transform="translate(${f1(n.x)},${f1(n.y)})"
    aria-label="${esc(`${n.id} ${n.name} ${c.word}`)}">
    <title>${esc(`${n.id} · ${n.name} · ${c.word}`)}</title>
    <circle class="hitRing tb" r="${f1(R+4)}" fill="none" stroke="#fff" stroke-width="2"/>
    <g class="bob" style="--bt:${f1(5+rnd()*2.5)}s;--bb:-3.5px;animation-delay:-${f1(rnd()*5)}s">${inner}</g>
    <text x="${lx}" y="-3" text-anchor="${anchor}" class="lid" fill="${c.label}">${esc(n.id)}</text>
    <g transform="translate(0,5)">
      <rect x="${pillX}" y="-16" width="56" height="19" rx="9.5" class="statusPill"
        fill="${c.main}" fill-opacity="${n.st==='pending'?'.12':'.2'}" stroke="${c.main}"/>
      <text x="${pillCx}" y="-2.2" text-anchor="middle" class="statusWord" fill="${c.bright}">${c.word}</text>
    </g>
    <text x="${lx}" y="17" text-anchor="${anchor}" class="lname">${esc(visibleName)}</text>
  </g>`;
});

/* foreground bokeh (depth) */
FX+=`<circle cx="238" cy="212" r="88" fill="#16223a" opacity=".4" filter="url(#b18)" class="neb" style="--nd:70s"/>
<circle cx="1432" cy="712" r="72" fill="#1a1626" opacity=".4" filter="url(#b18)" class="neb" style="--nd:60s;animation-delay:-25s"/>`;

document.getElementById('scene').innerHTML=
  `<defs>${DEFS}</defs><g>${BG}</g><g>${RAIL}</g><g>${FORGE}</g><g id="pulseL"></g><g>${NODE}</g><g>${FX}</g>`;

/* ================= commit pulse engine ================= */
const SVGNS='http://www.w3.org/2000/svg';
const routes=segs.map(g=>{
  const u0=Math.min(.35,NR(g.s)/g.len*.9);
  const u1=Math.max(u0+.05,1-Math.min(.35,NR(g.d)/g.len*.7));
  return{g,target:g.d,dur:900+g.len*2.2,u0,u1};
});
/* schedule: first at 800ms then every 4.4-5.4s (both自检帧都有脉冲在途) */
const SCHED=[];{let t=800,k=0;const gaps=[4400,5100,4700,5400,4600];
  while(routes.length&&t<600000){SCHED.push({t,r:k%routes.length});t+=gaps[k%5];k++;}}
const pulseL=document.getElementById('pulseL');
const active=[];let sIdx=0;
function spawn(rt,born){
  const g=document.createElementNS(SVGNS,'g');
  const mk=(r,fill,op)=>{const c=document.createElementNS(SVGNS,'circle');
    c.setAttribute('r',r);c.setAttribute('fill',fill);if(op)c.setAttribute('opacity',op);g.appendChild(c);return c};
  const glow=mk(24,'url(#beadR)','.28'),halo=mk(15,'url(#beadR)','.55'),
        tr3=mk(2.2,'#ffd98c','.3'),tr2=mk(3.2,'#ffd98c','.45'),tr1=mk(4.4,'#ffe3a8','.65'),core=mk(5.5,'#fff');
  pulseL.appendChild(g);
  active.push({rt,born,g,parts:[[core,0],[halo,0],[glow,0],[tr1,.05],[tr2,.1],[tr3,.15]]});}
/* setTimeout-driven deterministic clock — rAF does not fire in headless
   screenshot mode, timers do (and follow --virtual-time-budget) */
let vt=0;const STEP=33;
function tick(){
  vt+=STEP;
  while(sIdx<SCHED.length&&SCHED[sIdx].t<=vt){spawn(routes[SCHED[sIdx].r],SCHED[sIdx].t);sIdx++;}
  for(let i=active.length-1;i>=0;i--){const p=active[i];
    const u=(vt-p.born)/p.rt.dur;
    if(u>=1){p.g.remove();active.splice(i,1);
      const tn=document.getElementById('node-'+p.rt.target.uid);
      if(tn){tn.classList.remove('hit');void tn.getBoundingClientRect;
        tn.classList.add('hit');setTimeout(()=>tn.classList.remove('hit'),720);}
      continue;}
    p.parts.forEach(([el,lag])=>{
      const uu=Math.max(0,u-lag);
      const m=p.rt.u0+(p.rt.u1-p.rt.u0)*uu;
      const q=qP(p.rt.g,m);
      el.setAttribute('cx',f1(q[0]));el.setAttribute('cy',f1(q[1]));});}
  setTimeout(tick,STEP);}
setTimeout(tick,STEP);

window.__STARFORGE_RENDERED__={
  source:HAS_PAYLOAD?'payload':'fallback',
  projectId:DATA.projectId,
  projectName:DATA.projectName,
  phaseCount:DATA.phases.length,
  taskCount:nodes.length,
  dependencyCount:segs.length,
  progress:TOTAL_PROGRESS,
  phases:DATA.phases.map(phase=>({id:phase.id,name:phase.name,total:phase.stats.total,done:phase.stats.done})),
  tasks:nodes.map(node=>({id:node.id,status:node.st,phase:node.phaseId,depends:node.depends.slice()}))};
document.dispatchEvent(new CustomEvent('starforge:rendered',{detail:window.__STARFORGE_RENDERED__}));
</script>

  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const far=document.querySelector('.depth-far'),mid=document.querySelector('.depth-mid'),near=document.querySelector('.depth-near');
  addEventListener('pointermove',e=>{
    const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
    far.style.transform=`translate(${x*-5}px,${y*-4}px)`;
    mid.style.transform=`translate(${x*-12}px,${y*-9}px)`;
    near.style.transform=`translate(${x*-26}px,${y*-19}px)`;
  },{passive:true});
})();
</script>
