<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CodeViz · 星灵觉醒 Constellation</title>
<style>
  :root{
    --done:#2ee6a8; --prog:#ffc65c; --err:#ff6b6b; --pend:#5a6b85;
    --ink:#e8f1f8; --sub:#9fb2c8; --dim:#5f7189;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:900px;overflow:hidden;background:#04060c;
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;}
  .stage{position:relative;width:1600px;height:900px;isolation:isolate;
    background:
      radial-gradient(1150px 720px at 30% 44%, rgba(21,66,78,.17), transparent 62%),
      radial-gradient(880px 600px at 82% 42%, rgba(94,58,26,.11), transparent 62%),
      radial-gradient(720px 480px at 60% 8%, rgba(56,42,96,.10), transparent 66%),
      linear-gradient(158deg,#070b16 0%,#04060c 46%,#060a13 100%);}
  .neb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
  .n1{left:110px;top:170px;width:780px;height:520px;
    background:radial-gradient(closest-side, rgba(24,96,104,.15), transparent 72%);
    animation:drift1 64s ease-in-out infinite alternate}
  .n2{left:970px;top:150px;width:580px;height:480px;
    background:radial-gradient(closest-side, rgba(142,86,34,.09), transparent 72%);
    animation:drift2 76s ease-in-out infinite alternate}
  .n3{left:600px;top:-120px;width:520px;height:400px;
    background:radial-gradient(closest-side, rgba(74,56,138,.10), transparent 72%);
    animation:drift1 90s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(30px,-16px)}}
  @keyframes drift2{to{transform:translate(-26px,20px)}}

  svg#scene{position:absolute;inset:0;z-index:2}
  .depth-layer{position:absolute;inset:-50px;pointer-events:none;overflow:hidden;will-change:transform}
  .depth-far{z-index:0;opacity:.7;background-image:
    radial-gradient(circle,rgba(214,231,255,.72) 0 1px,transparent 1.6px),
    radial-gradient(circle,rgba(110,248,213,.45) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,205,120,.35) 0 1px,transparent 1.5px);
    background-size:149px 163px,251px 227px,337px 293px;
    animation:starCruise 55s linear infinite}
  .depth-mid{z-index:1;background:
    radial-gradient(ellipse at 31% 48%,rgba(19,137,126,.12),transparent 39%),
    radial-gradient(ellipse at 83% 42%,rgba(217,144,54,.08),transparent 34%);
    animation:cosmicBreath 10s ease-in-out infinite alternate}
  .depth-near{z-index:3}
  .depth-near i{position:absolute;width:170px;height:2px;border-radius:50%;
    background:linear-gradient(90deg,transparent,rgba(211,236,255,.08),rgba(142,255,223,.58));
    filter:drop-shadow(0 0 5px rgba(114,255,222,.28));transform:rotate(-24deg);
    animation:cometPass 15s linear infinite;opacity:0}
  .depth-near i:nth-child(2){width:90px;animation-delay:-7s;animation-duration:19s}
  .depth-near i:nth-child(3){width:240px;animation-delay:-12s;animation-duration:23s}
  @keyframes starCruise{to{background-position:149px 70px,-100px 227px,72px -293px}}
  @keyframes cosmicBreath{to{filter:brightness(1.3);transform:scale(1.035)}}
  @keyframes cometPass{0%,68%{transform:translate(-360px,260px) rotate(-24deg) scale(.6);opacity:0}
    72%{opacity:.7}86%,100%{transform:translate(1850px,-540px) rotate(-24deg) scale(1.25);opacity:0}}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(1250px 800px at 50% 46%, transparent 55%, rgba(2,4,9,.45) 100%);}

  /* ---------- top bar ---------- */
  header{position:absolute;top:0;left:0;right:0;height:64px;z-index:9;
    display:flex;align-items:center;justify-content:space-between;padding:0 40px;
    background:linear-gradient(180deg, rgba(9,15,27,.92), rgba(9,15,27,.35));
    border-bottom:1px solid rgba(127,242,220,.09);}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg, transparent, rgba(46,230,168,.35) 30%, rgba(127,242,220,.15) 60%, transparent);}
  .hleft,.hright{display:flex;align-items:center;gap:14px}
  .brand{font-size:17px;font-weight:700;letter-spacing:.6px;color:#eaf4fb}
  .brand b{color:var(--done);font-weight:700}
  .tagpill{font-size:12px;color:#8ff0da;letter-spacing:.5px;padding:4px 12px;border-radius:999px;
    border:1px solid rgba(46,230,168,.32);
    background:linear-gradient(180deg, rgba(46,230,168,.10), rgba(46,230,168,.02));}
  .chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;
    font-size:12px;color:var(--sub);
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.10);}
  .chip b{color:#eef6fc;font-size:13px;font-weight:700}
  .chip i{width:8px;height:8px;border-radius:50%;flex:none}
  .c-done{border-color:rgba(46,230,168,.35)} .c-done i{background:radial-gradient(circle at 35% 35%, #b9ffe6, var(--done));box-shadow:0 0 8px rgba(46,230,168,.7)}
  .c-prog{border-color:rgba(255,198,92,.35)} .c-prog i{background:radial-gradient(circle at 35% 35%, #ffedc4, var(--prog));box-shadow:0 0 8px rgba(255,198,92,.7);animation:dotPulse 1.8s ease-in-out infinite}
  .c-err{border-color:rgba(255,107,107,.30)} .c-err i{background:radial-gradient(circle at 35% 35%, #ffd2d2, var(--err));box-shadow:0 0 6px rgba(255,107,107,.5)}
  .c-pend{border-color:rgba(122,140,168,.32)} .c-pend i{background:radial-gradient(circle at 35% 35%, #b6c4d8, var(--pend))}
  @keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.75}}
  .hdiv{width:1px;height:22px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.16),transparent)}
  .ringwrap{display:flex;align-items:center;gap:8px}
  .ringwrap .rlabel{font-size:11px;color:var(--sub);letter-spacing:.5px}
  .live{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;
    font-size:12px;color:#a9f4dd;border:1px solid rgba(46,230,168,.38);
    background:linear-gradient(180deg, rgba(46,230,168,.12), rgba(46,230,168,.03));}
  .live i{width:7px;height:7px;border-radius:50%;background:#4dffc0;box-shadow:0 0 9px rgba(77,255,192,.9);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}55%{opacity:.25}}

  /* ---------- legend & caption ---------- */
  .legend{position:absolute;left:40px;bottom:16px;z-index:9;display:flex;align-items:center;gap:18px;
    font-size:12px;color:var(--sub)}
  .legend .ltitle{color:rgba(150,172,196,.55);letter-spacing:1px;margin-right:2px}
  .litem{display:inline-flex;align-items:center;gap:7px}
  .lnote{color:rgba(130,150,175,.5);margin-left:6px}
  .caption{position:absolute;right:40px;bottom:18px;z-index:9;font-size:12px;letter-spacing:.3px;
    color:rgba(148,170,193,.72);text-align:right}
  .caption b{color:rgba(143,240,218,.85);font-weight:600}

  /* ---------- svg animations ---------- */
  .tw{animation:tw 6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.08}50%{opacity:.75}}
  .mote{animation:moteUp 24s linear infinite}
  @keyframes moteUp{0%{transform:translate(0,0);opacity:0}12%{opacity:.32}80%{opacity:.26}100%{transform:translate(9px,-54px);opacity:0}}
  .fgb{animation:fgDrift 46s ease-in-out infinite alternate}
  @keyframes fgDrift{to{transform:translate(16px,-22px)}}

  .flowdash{stroke-dasharray:8 7;animation:dashflow 1.25s linear infinite}
  @keyframes dashflow{to{stroke-dashoffset:-30}}
  .flowdim{stroke-dasharray:2.5 6.5}
  .breathA{animation:breath 4.2s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.30}50%{opacity:.62}}
  .breathB{animation:breathB 4.2s ease-in-out infinite}
  @keyframes breathB{0%,100%{opacity:.10}50%{opacity:.26}}
  .eyeGlow{animation:eye 4.2s ease-in-out infinite}
  @keyframes eye{0%,100%{opacity:.55}50%{opacity:1}}
  .doneShimmer{animation:shim 5s ease-in-out infinite}
  @keyframes shim{0%,100%{opacity:.68}50%{opacity:1}}
  .p-core{transform-box:fill-box;transform-origin:center;animation:corePulse 2.4s ease-in-out infinite alternate}
  @keyframes corePulse{from{transform:scale(1);opacity:.85}to{transform:scale(1.14);opacity:1}}
  .core{transform-box:fill-box;transform-origin:center}
  .node-progress{filter:drop-shadow(0 0 5px rgba(255,198,92,.42))}
  .node-error{filter:drop-shadow(0 0 6px rgba(255,70,78,.58))}
  .charge-wave{transform-box:fill-box;transform-origin:center;animation:chargeWave 1.55s ease-out infinite}
  @keyframes chargeWave{0%{transform:scale(.7);opacity:.9}72%,100%{transform:scale(1.75);opacity:0}}
  .error-jolt{transform-box:fill-box;transform-origin:center;animation:errorJolt 1.9s steps(1,end) infinite}
  @keyframes errorJolt{0%,82%,100%{transform:translate(0,0)}84%{transform:translate(-2px,1px)}87%{transform:translate(2px,-1px)}90%{transform:translate(-1px,-1px)}}
  @media (prefers-reduced-motion:reduce){
    .charge-wave,.error-jolt,.p-core,.flowdash{animation:none!important}
  }

  /* ---------- payload-driven constellation map ---------- */
  body.cv-payload-mode #nodes,
  body.cv-payload-mode #conduits,
  body.cv-payload-mode #chev,
  body.cv-payload-mode #rails,
  body.cv-payload-mode #beads,
  body.cv-payload-mode #titles,
  body.cv-payload-mode #gate,
  body.cv-payload-mode #s12{display:none}
  body.cv-payload-mode #ribbon,
  body.cv-payload-mode #tailG,
  body.cv-payload-mode #limbs,
  body.cv-payload-mode #head,
  body.cv-payload-mode #whiskers,
  body.cv-payload-mode #phoenix{opacity:.23}
  .cv-live-map text{user-select:none}
  .cv-phase-card{fill:rgba(6,13,24,.72);stroke:rgba(127,242,220,.18);stroke-width:1}
  .cv-phase-card-glow{fill:none;stroke-width:7;opacity:.06;filter:url(#b8)}
  .cv-phase-orbit{fill:none;stroke:rgba(127,242,220,.11);stroke-width:1;stroke-dasharray:2 7}
  .cv-phase-progress-bg{fill:rgba(116,137,167,.16)}
  .cv-phase-progress{fill:#2ee6a8}
  .cv-dependency{fill:none;stroke-width:1.55;stroke-linecap:round;opacity:.66}
  .cv-dependency.status-done{stroke:#2ee6a8}
  .cv-dependency.status-in-progress{stroke:#ffc65c;stroke-dasharray:6 7;animation:cvDepFlow 1.2s linear infinite}
  .cv-dependency.status-pending{stroke:#74859f;stroke-dasharray:2 6;opacity:.46}
  .cv-dependency.status-error{stroke:#ff5968;stroke-dasharray:3 4;animation:cvDepFlow .7s linear infinite}
  .cv-task{cursor:default}
  .cv-task-status-ring{transform-box:fill-box;transform-origin:center}
  .cv-task.status-in-progress .cv-task-status-ring{animation:cvOrbit 5s linear infinite}
  .cv-task.status-error{filter:drop-shadow(0 0 5px rgba(255,70,78,.45))}
  .cv-task.status-in-progress{filter:drop-shadow(0 0 5px rgba(255,198,92,.32))}
  .cv-task-pulse{transform-box:fill-box;transform-origin:center;animation:chargeWave 1.7s ease-out infinite}
  @keyframes cvDepFlow{to{stroke-dashoffset:-26}}
  @keyframes cvOrbit{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .cv-dependency,.cv-task-status-ring,.cv-task-pulse{animation:none!important}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="depth-layer depth-far" aria-hidden="true"></div>
  <div class="depth-layer depth-mid" aria-hidden="true"></div>
  <div class="depth-layer depth-near" aria-hidden="true">
    <i style="left:3%;top:76%"></i><i style="left:34%;top:88%"></i><i style="left:68%;top:72%"></i>
  </div>
  <div class="neb n1"></div><div class="neb n2"></div><div class="neb n3"></div>

  <svg id="scene" viewBox="0 0 1600 900" width="1600" height="900">
    <defs>
      <filter id="b2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
      <filter id="b4" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="4"/></filter>
      <filter id="b8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>

      <linearGradient id="tealStroke" gradientUnits="userSpaceOnUse" x1="205" y1="200" x2="370" y2="410">
        <stop offset="0" stop-color="#96f6e2"/><stop offset=".5" stop-color="#2ee6a8"/><stop offset="1" stop-color="#177a63"/>
      </linearGradient>
      <linearGradient id="greenStroke" gradientUnits="userSpaceOnUse" x1="1150" y1="240" x2="1340" y2="430">
        <stop offset="0" stop-color="#aef7e0"/><stop offset=".55" stop-color="#2ee6a8"/><stop offset="1" stop-color="#1d8a6d"/>
      </linearGradient>
      <linearGradient id="spineGrad" gradientUnits="userSpaceOnUse" x1="300" y1="230" x2="910" y2="750">
        <stop offset="0" stop-color="#7ff2dc" stop-opacity=".55"/>
        <stop offset=".45" stop-color="#2ee6a8" stop-opacity=".26"/>
        <stop offset="1" stop-color="#4a5d78" stop-opacity=".05"/>
      </linearGradient>
      <linearGradient id="g_c23" gradientUnits="userSpaceOnUse" x1="430" y1="218" x2="600" y2="318">
        <stop offset="0" stop-color="#ffe3a6"/><stop offset="1" stop-color="#ffb43e"/>
      </linearGradient>
      <linearGradient id="g_c34" gradientUnits="userSpaceOnUse" x1="600" y1="318" x2="712" y2="452">
        <stop offset="0" stop-color="#ffe3a6"/><stop offset="1" stop-color="#ffb43e"/>
      </linearGradient>
      <linearGradient id="g_p12" gradientUnits="userSpaceOnUse" x1="1180" y1="300" x2="1310" y2="400">
        <stop offset="0" stop-color="#8ff5dd"/><stop offset="1" stop-color="#2ee6a8"/>
      </linearGradient>
      <linearGradient id="divGrad" gradientUnits="userSpaceOnUse" x1="1032" y1="110" x2="1032" y2="780">
        <stop offset="0" stop-color="#8febd7" stop-opacity="0"/>
        <stop offset=".5" stop-color="#8febd7" stop-opacity=".13"/>
        <stop offset="1" stop-color="#8febd7" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="breathGrad" gradientUnits="userSpaceOnUse" x1="216" y1="392" x2="198" y2="450">
        <stop offset="0" stop-color="#7ff2dc" stop-opacity=".14"/><stop offset="1" stop-color="#7ff2dc" stop-opacity="0"/>
      </linearGradient>

      <radialGradient id="starG"><stop offset="0" stop-color="#e2ecff" stop-opacity=".95"/><stop offset="1" stop-color="#e2ecff" stop-opacity="0"/></radialGradient>
      <radialGradient id="haloDone"><stop offset="0" stop-color="#2ee6a8" stop-opacity=".42"/><stop offset=".55" stop-color="#2ee6a8" stop-opacity=".13"/><stop offset="1" stop-color="#2ee6a8" stop-opacity="0"/></radialGradient>
      <radialGradient id="haloProg"><stop offset="0" stop-color="#ffc65c" stop-opacity=".46"/><stop offset=".55" stop-color="#ffc65c" stop-opacity=".14"/><stop offset="1" stop-color="#ffc65c" stop-opacity="0"/></radialGradient>
      <radialGradient id="haloPend"><stop offset="0" stop-color="#5a6b85" stop-opacity=".30"/><stop offset="1" stop-color="#5a6b85" stop-opacity="0"/></radialGradient>
      <radialGradient id="haloErr"><stop offset="0" stop-color="#ff384d" stop-opacity=".48"/><stop offset=".58" stop-color="#ff384d" stop-opacity=".14"/><stop offset="1" stop-color="#ff384d" stop-opacity="0"/></radialGradient>
      <radialGradient id="coreDone"><stop offset="0" stop-color="#eafff7"/><stop offset=".3" stop-color="#9df5d8"/><stop offset=".62" stop-color="#2ee6a8"/><stop offset="1" stop-color="#2ee6a8" stop-opacity="0"/></radialGradient>
      <radialGradient id="coreProg"><stop offset="0" stop-color="#fff8e8"/><stop offset=".3" stop-color="#ffe2a3"/><stop offset=".62" stop-color="#ffc65c"/><stop offset="1" stop-color="#ffc65c" stop-opacity="0"/></radialGradient>
      <radialGradient id="corePend"><stop offset="0" stop-color="#b9c8db" stop-opacity=".75"/><stop offset=".5" stop-color="#6b7f9c" stop-opacity=".4"/><stop offset="1" stop-color="#5a6b85" stop-opacity="0"/></radialGradient>
      <radialGradient id="coreErr"><stop offset="0" stop-color="#fff0f0"/><stop offset=".28" stop-color="#ff9b9b"/><stop offset=".62" stop-color="#ff4558"/><stop offset="1" stop-color="#8f1327" stop-opacity=".1"/></radialGradient>
      <radialGradient id="pearlCore"><stop offset="0" stop-color="#fff8ea"/><stop offset=".22" stop-color="#ffe8b0"/><stop offset=".5" stop-color="#ffc65c"/><stop offset=".8" stop-color="#f09946" stop-opacity=".4"/><stop offset="1" stop-color="#f09946" stop-opacity="0"/></radialGradient>
      <radialGradient id="beadG"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ffedc2"/><stop offset=".7" stop-color="#ffc65c" stop-opacity=".55"/><stop offset="1" stop-color="#ffc65c" stop-opacity="0"/></radialGradient>
      <linearGradient id="beadTail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffc65c" stop-opacity="0"/><stop offset="1" stop-color="#ffe9b8" stop-opacity=".9"/></linearGradient>
      <radialGradient id="washTeal"><stop offset="0" stop-color="#1f8f86" stop-opacity=".16"/><stop offset="1" stop-color="#1f8f86" stop-opacity="0"/></radialGradient>
      <radialGradient id="washGold"><stop offset="0" stop-color="#c07a2e" stop-opacity=".16"/><stop offset="1" stop-color="#c07a2e" stop-opacity="0"/></radialGradient>
      <radialGradient id="washGreen"><stop offset="0" stop-color="#1f8f6d" stop-opacity=".12"/><stop offset="1" stop-color="#1f8f6d" stop-opacity="0"/></radialGradient>

      <!-- dragon head : compound line-art -->

        M 332,226 C 306,228 284,238 268,258 C 252,278 236,306 218,338 C 212,349 207,360 206,371

        M 210,378 C 230,370 252,360 272,350
        M 226,402 C 246,396 268,382 285,362
        M 285,362 C 305,346 316,330 322,308
        M 292,240 C 310,222 330,210 352,204 C 362,201 372,201 380,204
        M 342,206 C 348,196 356,190 366,188
        M 276,246 C 290,230 302,222 318,214
        M 258,262 C 250,254 240,250 230,252
        M 262,378 C 260,390 254,398 246,402
        M 218,384 L 223,394
        M 241,373 L 245,382"/>
      <!-- phoenix formed line-art -->

        M 1184,288 C 1180,272 1184,258 1194,248
        M 1190,292 C 1192,274 1200,262 1212,254
        M 1196,296 C 1204,282 1216,272 1230,266
        M 1172,301 C 1162,306 1154,311 1149,316
        M 1149,316 L 1156,318"/>
      <path id="phxWing" d="
        M 1310,392 C 1336,352 1368,318 1408,296
        M 1312,398 C 1348,368 1390,344 1436,332
        M 1314,404 C 1352,384 1398,368 1444,362
        M 1408,296 L 1430,286
        M 1436,332 L 1459,326
        M 1444,362 L 1467,360
        M 1318,388 C 1330,374 1344,362 1360,352"/>
    </defs>

    <!-- ================= background stars / far constellations ================= -->
    <g id="stars"></g>
    <g id="farconst" stroke="rgba(160,200,220,.10)" stroke-width="1" fill="none">
      <path d="M 660,132 L 700,118 L 742,138 L 788,126" stroke-opacity=".45"/>
      <circle cx="660" cy="132" r="1.4" fill="rgba(190,220,235,.35)" stroke="none"/>
      <circle cx="700" cy="118" r="1.8" fill="rgba(190,220,235,.4)" stroke="none"/>
      <circle cx="742" cy="138" r="1.3" fill="rgba(190,220,235,.3)" stroke="none"/>
      <circle cx="788" cy="126" r="1.6" fill="rgba(190,220,235,.35)" stroke="none"/>
      <path d="M 1084,742 L 1122,726 L 1163,742" stroke-opacity=".35"/>
      <circle cx="1084" cy="742" r="1.3" fill="rgba(190,220,235,.28)" stroke="none"/>
      <circle cx="1122" cy="726" r="1.6" fill="rgba(190,220,235,.32)" stroke="none"/>
      <circle cx="1163" cy="742" r="1.2" fill="rgba(190,220,235,.26)" stroke="none"/>
    </g>

    <!-- ================= 周天十二辰引脉环 (astrolabe dial) ================= -->
    <g id="dial">
      <g id="dialSpin">
        <circle cx="520" cy="430" r="332" fill="none" stroke="rgba(140,235,215,.10)" stroke-width="1"/>
        <circle cx="520" cy="430" r="320" fill="none" stroke="rgba(140,235,215,.055)" stroke-width="1" stroke-dasharray="1 6"/>
        <rect x="276" y="186" width="488" height="488" fill="none" stroke="rgba(140,235,215,.045)" stroke-width="1" transform="rotate(45 520 430)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 520 430" to="360 520 430" dur="64s" repeatCount="indefinite"/>
      </g>
      <g id="dialInner">
        <path d="M 520,194 A 236,236 0 0 1 724,312" fill="none" stroke="rgba(140,235,215,.13)" stroke-width="1.4"/>
        <path d="M 622,634 A 236,236 0 0 1 386,652" fill="none" stroke="rgba(140,235,215,.10)" stroke-width="1.4"/>
        <path d="M 288,406 A 236,236 0 0 1 368,236" fill="none" stroke="rgba(140,235,215,.08)" stroke-width="1.4"/>
        <animateTransform attributeName="transform" type="rotate" from="360 520 430" to="0 520 430" dur="44s" repeatCount="indefinite"/>
      </g>
      <!-- commit gate : fixed index on rotating dial -->
      <g id="gate">
        <circle cx="233" cy="596" r="13" fill="none" stroke="rgba(255,198,92,.38)" stroke-width="1" stroke-dasharray="2 4">
          <animateTransform attributeName="transform" type="rotate" from="0 233 596" to="360 233 596" dur="14s" repeatCount="indefinite"/>
        </circle>
        <circle cx="233" cy="596" r="9" fill="url(#beadG)" opacity=".35"/>

             stroke:'rgba(140,235,215,.08)','stroke-width':.8},d2t);
}

/* ---------- spine decorations : vertebrae + dorsal fins ---------- */
function nearStar(p){return TASKS.some(t=>{const dx=t.x-p.x,dy=t.y-p.y;return dx*dx+dy*dy<26*26})}
function decorate(pathId,group,a0,a1,finA0,finA1){
  const path=$(pathId),L=path.getTotalLength();
  for(let d=16;d<L-10;d+=24){
    const p=path.getPointAtLength(d),q=path.getPointAtLength(Math.min(L,d+1.5));
    const th=Math.atan2(q.y-p.y,q.x-p.x),nx=Math.sin(th),ny=-Math.cos(th);
    if(nearStar(p))continue;
    const f=d/L,a=a0+(a1-a0)*f;
    mk('line',{x1:(p.x-nx*4).toFixed(1),y1:(p.y-ny*4).toFixed(1),x2:(p.x+nx*4).toFixed(1),y2:(p.y+ny*4).toFixed(1),
      stroke:'rgba(140,235,215,'+a.toFixed(3)+')','stroke-width':1},group);
  }
  for(let d=34;d<L-20;d+=52){
    const p=path.getPointAtLength(d),q=path.getPointAtLength(Math.min(L,d+1.5));
    const th=Math.atan2(q.y-p.y,q.x-p.x),tx=Math.cos(th),ty=Math.sin(th),nx=Math.sin(th),ny=-Math.cos(th);
    if(nearStar(p))continue;
    const f=d/L,a=finA0+(finA1-finA0)*f,h=8+7*Math.abs(Math.sin(d*.045));
    mk('path',{d:'M '+(p.x-tx*4.5).toFixed(1)+','+(p.y-ty*4.5).toFixed(1)+
                ' L '+(p.x+nx*h).toFixed(1)+','+(p.y+ny*h).toFixed(1)+
                ' L '+(p.x+tx*4.5).toFixed(1)+','+(p.y+ty*4.5).toFixed(1),
      fill:'rgba(127,242,220,'+(a*.4).toFixed(3)+')',stroke:'rgba(140,235,215,'+a.toFixed(3)+')','stroke-width':.9,'stroke-linejoin':'round'},group);
  }
}
decorate('spinePath',$('spineDeco'),.26,.10,.30,.12);
decorate('tailPath',$('tailDeco'),.10,.04,.12,.05);

/* ---------- chevrons (flow direction) ---------- */
const chev=$('chev');
function chevrons(pathId,fracs,color,op){
  const path=$(pathId),L=path.getTotalLength();
  fracs.forEach(f=>{
    const p=path.getPointAtLength(L*f),q=path.getPointAtLength(Math.min(L,L*f+2));
    const a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
    mk('path',{d:'M -5,-4 L 3.5,0 L -5,4',fill:'none',stroke:color,'stroke-width':1.7,
      'stroke-linecap':'round','stroke-linejoin':'round',opacity:op,
      transform:'translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') rotate('+a.toFixed(1)+')'},chev);
  });
}
chevrons('c23',[.44,.52],'#ffe3a6',.9);
chevrons('c34',[.44,.52],'#ffe3a6',.9);
chevrons('c45',[.5],'rgba(150,168,196,1)',.5);
chevrons('p12',[.44,.52],'#8ff5dd',.9);
chevrons('p23',[.5],'rgba(150,168,196,1)',.5);

/* ---------- nodes ---------- */
const nodes=$('nodes');
(window.__CODEVIZ_THEME_DATA__ ? [] : TASKS).forEach(t=>{
  const r=R(t.load),g=mk('g',{id:'n-'+t.id,'class':'node node-'+(t.st==='prog'?'progress':t.st==='err'?'error':t.st)},nodes);
  const halo={done:'url(#haloDone)',prog:'url(#haloProg)',pend:'url(#haloPend)',err:'url(#haloErr)'}[t.st];
  mk('circle',{cx:t.x,cy:t.y,r:(r*3.1).toFixed(1),fill:halo,opacity:t.st==='pend'?.5:1},g);
  if(t.st==='prog'){
    mk('circle',{cx:t.x,cy:t.y,r:(r+3).toFixed(1),fill:'none',stroke:'#ffd98c','stroke-width':2.2,opacity:.72,'class':'charge-wave'},g);
    const cr=mk('circle',{cx:t.x,cy:t.y,r:(r+7).toFixed(1),fill:'none',stroke:'#ffc65c','stroke-width':1.6,'stroke-dasharray':'5 8',opacity:.75},g);
    const at=document.createElementNS(NS,'animateTransform');
    at.setAttribute('attributeName','transform');at.setAttribute('type','rotate');
    at.setAttribute('from','0 '+t.x+' '+t.y);at.setAttribute('to','360 '+t.x+' '+t.y);
    at.setAttribute('dur',(5+t.load*.6)+'s');at.setAttribute('repeatCount','indefinite');cr.appendChild(at);
    if(t.load>=2){
      const or=mk('circle',{cx:t.x,cy:t.y,r:(r+13).toFixed(1),fill:'none',stroke:'#ffc65c','stroke-width':1,'stroke-dasharray':'1 10',opacity:.30,'stroke-linecap':'round'},g);
      const at2=document.createElementNS(NS,'animateTransform');
      at2.setAttribute('attributeName','transform');at2.setAttribute('type','rotate');
      at2.setAttribute('from','360 '+t.x+' '+t.y);at2.setAttribute('to','0 '+t.x+' '+t.y);
      at2.setAttribute('dur','12s');at2.setAttribute('repeatCount','indefinite');or.appendChild(at2);
    }
  }else if(t.st==='done'){
    mk('circle',{cx:t.x,cy:t.y,r:(r+6).toFixed(1),fill:'rgba(20,70,59,.32)',stroke:'rgba(46,230,168,.72)','stroke-width':1.6},g);
    mk('path',{d:'M '+(t.x-r*.42)+','+t.y+' L '+(t.x-r*.08)+','+(t.y+r*.34)+' L '+(t.x+r*.55)+','+(t.y-r*.42),
      fill:'none',stroke:'#d8fff0','stroke-width':2.3,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  }else if(t.st==='err'){
    const eg=mk('g',{'class':'error-jolt'},g);
    mk('path',{d:'M '+t.x+','+(t.y-r-7)+' L '+(t.x+r+6)+','+(t.y-r*.24)+' L '+(t.x+r*.62)+','+(t.y+r+6)+' L '+(t.x-r*.72)+','+(t.y+r*.62)+' L '+(t.x-r-6)+','+(t.y-r*.3)+' Z',
      fill:'rgba(103,15,31,.72)',stroke:'#ff5968','stroke-width':2},eg);
    mk('path',{d:'M '+(t.x-2)+','+(t.y-r-5)+' L '+(t.x-5)+','+(t.y-2)+' L '+(t.x+2)+','+(t.y+2)+' L '+(t.x-3)+','+(t.y+r+5)+' M '+(t.x-5)+','+(t.y-2)+' L '+(t.x-r-7)+','+(t.y+4),
      fill:'none',stroke:'#ffd2d5','stroke-width':1.8},eg);
  }else{
    mk('circle',{cx:t.x,cy:t.y,r:(r+7).toFixed(1),fill:'rgba(18,25,38,.88)',stroke:'rgba(142,160,187,.62)','stroke-width':1.6,'stroke-dasharray':'3 5'},g);
    mk('circle',{cx:t.x,cy:t.y,r:(r*.62).toFixed(1),fill:'none',stroke:'rgba(142,160,187,.36)','stroke-width':1.2},g);
    const lockY=t.y-1;
    mk('rect',{x:(t.x-4.5),y:lockY,width:9,height:7,rx:1.5,fill:'rgba(151,168,193,.72)'},g);
    mk('path',{d:'M '+(t.x-3)+','+lockY+' V '+(lockY-2.5)+' A 3,3 0 0 1 '+(t.x+3)+','+(lockY-2.5)+' V '+lockY,
      fill:'none',stroke:'#c4cfdd','stroke-width':1.2},g);
  }
  /* sparkle cross */
  if(t.st==='prog'){
    const s=(r*1.9).toFixed(1),w=2.1,fill=t.st==='done'?'#eafff7':'#fff4dc';
    const sp=mk('path',{d:'M 0,-'+s+' L '+w+',0 L 0,'+s+' L -'+w+',0 Z M -'+s+',0 L 0,'+w+' L '+s+',0 L 0,-'+w+' Z',
      fill:fill,opacity:t.st==='done'?.9:.55,transform:'translate('+t.x+' '+t.y+')'},g);
    if(t.st==='done')sp.classList.add('doneShimmer');
  }
  /* core */
  if(t.id==='T007'){
    const core=mk('circle',{cx:t.x,cy:t.y,r:(r+4).toFixed(1),fill:'url(#pearlCore)','class':'core p-core'},g);
    const cg=mk('g',{},g);
    mk('path',{d:'M '+(t.x-10.5)+','+t.y+' A 10.5,10.5 0 0 1 '+t.x+','+(t.y-10.5),fill:'none',stroke:'#ffe8b0','stroke-width':1.7,'stroke-linecap':'round',opacity:.9},cg);
    mk('path',{d:'M '+(t.x+10.5)+','+t.y+' A 10.5,10.5 0 0 1 '+t.x+','+(t.y+10.5),fill:'none',stroke:'#ffe8b0','stroke-width':1.7,'stroke-linecap':'round',opacity:.9},cg);
    const at3=document.createElementNS(NS,'animateTransform');
    at3.setAttribute('attributeName','transform');at3.setAttribute('type','rotate');
    at3.setAttribute('from','0 '+t.x+' '+t.y);at3.setAttribute('to','360 '+t.x+' '+t.y);
    at3.setAttribute('dur','8s');at3.setAttribute('repeatCount','indefinite');cg.appendChild(at3);
    const orb=mk('circle',{r:1.7,fill:'#fff8ea',opacity:.9},g);
    const am=document.createElementNS(NS,'animateMotion');
    am.setAttribute('path','M '+(t.x+27)+','+t.y+' a 27,27 0 1 1 -54,0 a 27,27 0 1 1 54,0');
    am.setAttribute('dur','7.5s');am.setAttribute('repeatCount','indefinite');orb.appendChild(am);
  }else if(t.st!=='done' && t.st!=='err'){
    const fill={prog:'url(#coreProg)',pend:'url(#corePend)'}[t.st];
    const core=mk('circle',{cx:t.x,cy:t.y,r:(t.st==='pend'?r*.55:r*.85).toFixed(1),fill:fill,'class':'core'},g);
    if(t.st==='prog')core.classList.add('p-core');
  }
  /* flash ring for commit hit : SMIL timed on the 23s pulse cycle */
  if(t.st==='prog'){
    const ARR={T002:.121739,T007:.321739,T003:.521739,T004:.721739,T006:.921739}[t.id];
    const fl=mk('circle',{cx:t.x,cy:t.y,r:(r+3).toFixed(1),fill:'none',stroke:'#ffe8b0','stroke-width':2,opacity:0},g);
    const ao=document.createElementNS(NS,'animate');
    ao.setAttribute('attributeName','opacity');ao.setAttribute('dur','23s');ao.setAttribute('repeatCount','indefinite');
    ao.setAttribute('values','0;0;.9;0;0');ao.setAttribute('keyTimes','0;'+(ARR-.002).toFixed(4)+';'+ARR.toFixed(4)+';'+(ARR+.04).toFixed(4)+';1');
    fl.appendChild(ao);
    const ar=document.createElementNS(NS,'animate');
    ar.setAttribute('attributeName','r');ar.setAttribute('dur','23s');ar.setAttribute('repeatCount','indefinite');
    ar.setAttribute('values',[r+3,r+3,r+3,r+17,r+17].map(v=>v.toFixed(1)).join(';'));
    ar.setAttribute('keyTimes','0;'+(ARR-.002).toFixed(4)+';'+ARR.toFixed(4)+';'+(ARR+.04).toFixed(4)+';1');
    fl.appendChild(ar);
  }
  /* leader line */
  if(t.lead)mk('line',{x1:t.lead[0],y1:t.lead[1],x2:t.lead[2],y2:t.lead[3],stroke:'rgba(160,190,210,.22)','stroke-width':1,'stroke-dasharray':'1 3'},g);
  /* label */
  const tx=mk('text',{x:t.lx,y:t.ly,'text-anchor':t.anch,'font-size':12.5,
    style:'paint-order:stroke;stroke:rgba(5,9,16,.88);stroke-width:3px;stroke-linejoin:round'},g);
  if(t.st==='pend')tx.setAttribute('opacity','.62');
  const s1=document.createElementNS(NS,'tspan');s1.setAttribute('fill',LCOL[t.st]);s1.setAttribute('font-weight','700');s1.setAttribute('letter-spacing','.4');s1.textContent=t.id;
  const s2=document.createElementNS(NS,'tspan');s2.setAttribute('fill','rgba(200,216,232,.82)');s2.textContent=' '+t.name;
  tx.appendChild(s1);tx.appendChild(s2);
  /* direct status badge: readable without consulting the legend */
  const meta=STATUS[t.st], badgeW=t.st==='err'?50:68, badgeH=20, badgeY=t.ly+7;
  let badgeX=t.lx;
  if(t.anch==='middle')badgeX-=badgeW/2;
  else if(t.anch==='end')badgeX-=badgeW;
  mk('rect',{x:badgeX,y:badgeY,width:badgeW,height:badgeH,rx:10,fill:meta.bg,stroke:meta.border,'stroke-width':1},g);
  const bt=mk('text',{x:badgeX+badgeW/2,y:badgeY+14,'text-anchor':'middle','font-size':11.5,'font-weight':800,fill:meta.fg,
    style:'paint-order:stroke;stroke:rgba(5,9,16,.72);stroke-width:2px;letter-spacing:.5px'},g);
  bt.textContent=meta.icon+' '+meta.text;
});

/* ---------- phase progress segments ---------- */
function segs(gid,x0,y0,states){
  const g=$(gid);
  states.forEach((s,i)=>{
    const at={x:x0+i*21,y:y0,width:18,height:5,rx:2.5};
    if(s==='done'){at.fill='#2ee6a8';at.opacity=.95}
    else if(s==='prog'){at.fill='#ffc65c';at.opacity=.55}
    else{at.fill='#26324a';at.opacity=1}
    mk('rect',at,g);
    if(s==='done')mk('rect',{x:at.x,y:at.y,width:18,height:5,rx:2.5,fill:'#2ee6a8',opacity:.5,filter:'url(#b2)'},g);
  });
}
segs('segs1',108,148,['done','prog','prog','prog','pend','prog','prog']);
segs('segs2',1084,148,['done','done','pend']);

/* ---------- dust motes ---------- */
const motes=$('motes');
for(let i=0;i<14;i++){
  const x=60+rnd()*1480,y=180+rnd()*640,r=1+rnd()*1.4;
  const c=mk('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:r.toFixed(2),fill:'rgba(170,220,235,.5)','class':'mote'},motes);
  c.style.animationDuration=(18+rnd()*14).toFixed(1)+'s';
  c.style.animationDelay=(-rnd()*24).toFixed(1)+'s';
}

/* ---------- commit pulse engine : pure SMIL, 23s cycle = 5 pulses x 4.6s ---------- */
/* each bead flies its rail during a 2.2s window; deterministic under virtual time */
const beads=$('beads');
const order=['T002','T007','T003','T004','T006'];
order.forEach((id,i)=>{
  const s=(0.6+4.6*i)/23, e=(0.6+4.6*i+2.2)/23;
  const g=mk('g',{opacity:0},beads);
  /* comet: streak points backwards (-x), rotate=auto orients along rail */
  mk('path',{d:'M -20,0 L -5,-1.8 L 0,0 L -5,1.8 Z',fill:'url(#beadTail)',opacity:.75},g);
  mk('circle',{r:13,fill:'url(#beadG)',opacity:.9},g);
  mk('circle',{r:3.4,fill:'#fff8ea'},g);
  const am=document.createElementNS(NS,'animateMotion');
  am.setAttribute('dur','23s');am.setAttribute('repeatCount','indefinite');
  am.setAttribute('rotate','auto');am.setAttribute('calcMode','spline');
  am.setAttribute('keyPoints','0;0;1;1');
  am.setAttribute('keyTimes','0;'+s.toFixed(5)+';'+e.toFixed(5)+';1');
  am.setAttribute('keySplines','0 0 1 1;.42 0 .58 1;0 0 1 1');
  const mp=document.createElementNS(NS,'mpath');
  mp.setAttribute('href','#r_'+id);mp.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href','#r_'+id);
  am.appendChild(mp);g.appendChild(am);
  const ao=document.createElementNS(NS,'animate');
  ao.setAttribute('attributeName','opacity');ao.setAttribute('dur','23s');ao.setAttribute('repeatCount','indefinite');
  ao.setAttribute('values','0;0;1;1;0;0');
  ao.setAttribute('keyTimes','0;'+s.toFixed(5)+';'+(s+.008).toFixed(5)+';'+(e-.008).toFixed(5)+';'+e.toFixed(5)+';1');
  g.appendChild(ao);
});
})();
</script>
<script>
(function(){
'use strict';

const payload=window.__CODEVIZ_THEME_DATA__;
if(!payload||!Array.isArray(payload.tasks))return;

document.body.classList.add('cv-payload-mode');
document.body.dataset.projectId=String(payload.projectId||'');

const NS='http://www.w3.org/2000/svg';
const scene=document.getElementById('scene');
const defs=scene.querySelector('defs');
const make=(name,attrs,parent)=>{
  const element=document.createElementNS(NS,name);
  Object.entries(attrs||{}).forEach(([key,value])=>{
    if(value!==undefined&&value!==null)element.setAttribute(key,String(value));
  });
  if(parent)parent.appendChild(element);
  return element;
};
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
const asText=(value,fallback='')=>value===undefined||value===null?fallback:String(value);
const truncate=(value,limit)=>{
  const chars=Array.from(asText(value));
  return chars.length>limit?chars.slice(0,Math.max(1,limit-1)).join('')+'…':chars.join('');
};
const numberFrom=(value,fallback)=>{
  const number=Number(value);
  return Number.isFinite(number)?number:fallback;
};

const STATUS_META={
  pending:{label:'未开始',color:'#7d8da7',halo:'url(#haloPend)',core:'url(#corePend)'},
  'in-progress':{label:'加工中',color:'#ffc65c',halo:'url(#haloProg)',core:'url(#coreProg)'},
  done:{label:'已完成',color:'#2ee6a8',halo:'url(#haloDone)',core:'url(#coreDone)'},
  error:{label:'报错',color:'#ff5968',halo:'url(#haloErr)',core:'url(#coreErr)'}
};
function normalizeStatus(value){
  const status=asText(value,'pending').trim().toLowerCase().replace(/_/g,'-');
  if(status==='inprogress'||status==='progress'||status==='prog'||status==='working')return'in-progress';
  if(status==='complete'||status==='completed')return'done';
  if(status==='failed'||status==='err')return'error';
  return STATUS_META[status]?status:'pending';
}
function normalizeDepends(value){
  const list=Array.isArray(value)?value:typeof value==='string'?value.split(/[,，]/):[];
  return list.map(item=>asText(item&&typeof item==='object'?item.id:item).trim()).filter(Boolean);
}

const tasks=payload.tasks.map((raw,index)=>({
  key:index,
  id:asText(raw&&raw.id,`task-${index+1}`),
  name:asText(raw&&raw.name,asText(raw&&raw.id,`任务 ${index+1}`)),
  status:normalizeStatus(raw&&raw.status),
  phaseRef:raw&&raw.phase,
  depends:normalizeDepends(raw&&raw.depends),
  files:Array.isArray(raw&&raw.files)?raw.files:[],
  raw:raw||{}
}));

const rawPhases=Array.isArray(payload.phases)?payload.phases:[];
const phases=rawPhases.map((raw,index)=>{
  const phase=raw||{};
  const refs=new Set((Array.isArray(phase.tasks)?phase.tasks:[])
    .map(item=>asText(item&&typeof item==='object'?item.id:item).trim())
    .filter(Boolean));
  return{
    key:index,
    id:asText(phase.id,`phase-${index+1}`),
    name:asText(phase.name,`阶段 ${index+1}`),
    refs,
    tasks:[]
  };
});

const phaseById=new Map();
const phaseByName=new Map();
phases.forEach(phase=>{
  if(!phaseById.has(phase.id))phaseById.set(phase.id,phase);
  if(!phaseByName.has(phase.name))phaseByName.set(phase.name,phase);
});

const unassigned=[];
tasks.forEach(task=>{
  const ref=asText(task.phaseRef);
  let phase=phaseById.get(ref)||phaseByName.get(ref);
  if(!phase)phase=phases.find(candidate=>candidate.refs.has(task.id));
  if(phase)phase.tasks.push(task);
  else unassigned.push(task);
});
if(!phases.length){
  phases.push({key:0,id:'unphased',name:'任务星域',refs:new Set(),tasks:unassigned.splice(0)});
}else if(unassigned.length){
  phases.push({
    key:phases.length,
    id:'unphased',
    name:'未分阶段',
    refs:new Set(),
    tasks:unassigned.splice(0)
  });
}

const computed={total:tasks.length,done:0,pending:0,inProgress:0,error:0};
tasks.forEach(task=>{
  if(task.status==='done')computed.done++;
  else if(task.status==='in-progress')computed.inProgress++;
  else if(task.status==='error')computed.error++;
  else computed.pending++;
});
const sourceStats=payload.stats&&typeof payload.stats==='object'?payload.stats:{};
const stats={
  total:numberFrom(sourceStats.total,computed.total),
  done:numberFrom(sourceStats.done,computed.done),
  pending:numberFrom(sourceStats.pending,computed.pending),
  inProgress:numberFrom(sourceStats.inProgress,computed.inProgress),
  error:numberFrom(sourceStats.error,computed.error)
};
const completion=stats.total>0?clamp(stats.done/stats.total,0,1):0;
const completionPercent=Math.round(completion*100);
const projectName=asText(payload.projectName,'当前项目');

document.title=`CodeViz · ${projectName} · 星灵觉醒`;
const tag=document.querySelector('.tagpill');
if(tag)tag.textContent=`${projectName} · 星灵觉醒`;
const statTargets=[
  ['.c-done b',stats.done],
  ['.c-prog b',stats.inProgress],
  ['.c-err b',stats.error],
  ['.c-pend b',stats.pending]
];
statTargets.forEach(([selector,value])=>{
  const target=document.querySelector(selector);
  if(target)target.textContent=String(value);
});
const progressCircle=document.querySelector('.ringwrap svg circle:nth-of-type(2)');
const progressText=document.querySelector('.ringwrap svg text');
const circumference=2*Math.PI*15.5;
if(progressCircle)progressCircle.setAttribute('stroke-dasharray',
  `${(circumference*completion).toFixed(2)} ${(circumference*(1-completion)).toFixed(2)}`);
if(progressText)progressText.textContent=`${completionPercent}%`;
const caption=document.querySelector('.caption');
if(caption){
  const projectLabel=document.createElement('b');
  projectLabel.textContent=projectName;
  const progressLabel=document.createElement('b');
  progressLabel.textContent=`${completionPercent}%`;
  caption.replaceChildren(
    projectLabel,
    ` · ${phases.length} 个阶段 · ${stats.total} 个任务 · 真实依赖沿流光方向运行 —— 总进度 `,
    progressLabel
  );
}

function addMarker(id,color){
  const marker=make('marker',{
    id,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:7,markerHeight:7,
    orient:'auto',markerUnits:'userSpaceOnUse'
  },defs);
  make('path',{d:'M 0,0 L 8,4 L 0,8 Z',fill:color,opacity:.9},marker);
}
Object.entries(STATUS_META).forEach(([status,meta])=>addMarker(`cv-arrow-${status}`,meta.color));

const root=make('g',{
  id:'cv-live-map',
  class:'cv-live-map',
  'data-project-id':asText(payload.projectId),
  'data-phase-count':phases.length,
  'data-task-count':tasks.length
});
const motes=document.getElementById('motes');
scene.insertBefore(root,motes||null);
const phaseBacks=make('g',{class:'cv-phase-backs'},root);
const dependencies=make('g',{class:'cv-dependencies'},root);
const phaseFronts=make('g',{class:'cv-phase-fronts'},root);

function columnCount(count){
  if(count<=2)return Math.max(1,count);
  if(count<=6)return 3;
  if(count<=16)return 4;
  if(count<=20)return 5;
  return 6;
}
const bounds={x:64,y:118,width:1472,height:666};
const gapX=16;
const gapY=14;
const columns=columnCount(phases.length);
const rows=Math.max(1,Math.ceil(phases.length/columns));
const cellWidth=(bounds.width-gapX*(columns-1))/columns;
const cellHeight=(bounds.height-gapY*(rows-1))/rows;
const positionsByKey=new Map();
const positionsById=new Map();

function phaseStatus(phase){
  if(phase.tasks.some(task=>task.status==='error'))return'error';
  if(phase.tasks.length&&phase.tasks.every(task=>task.status==='done'))return'done';
  if(phase.tasks.some(task=>task.status==='in-progress'||task.status==='done'))return'in-progress';
  return'pending';
}
function taskRadius(task){
  const explicit=numberFrom(task.raw.load,NaN);
  const load=Number.isFinite(explicit)?explicit:Math.max(1,task.files.length);
  return clamp(6.5+load*.7,7,10);
}
function renderTask(task,x,y,slotWidth,dense,parent){
  const meta=STATUS_META[task.status];
  const radius=taskRadius(task);
  const group=make('g',{
    class:`cv-task status-${task.status}`,
    'data-task-id':task.id,
    'data-status':task.status,
    'data-phase':asText(task.phaseRef),
    role:'img',
    'aria-label':`${task.id} ${task.name}，${meta.label}`
  },parent);
  const title=make('title',{},group);
  title.textContent=`${task.id} · ${task.name} · ${meta.label}`;
  make('circle',{cx:x,cy:y,r:(radius*2.8).toFixed(1),fill:meta.halo,opacity:.9},group);
  make('path',{
    d:`M ${x},${(y-radius*1.65).toFixed(1)} L ${(x+1.25).toFixed(1)},${y} L ${x},${(y+radius*1.65).toFixed(1)} L ${(x-1.25).toFixed(1)},${y} Z M ${(x-radius*1.65).toFixed(1)},${y} L ${x},${(y+1.25).toFixed(1)} L ${(x+radius*1.65).toFixed(1)},${y} L ${x},${(y-1.25).toFixed(1)} Z`,
    fill:meta.color,opacity:task.status==='pending'?.26:.68
  },group);
  if(task.status==='done'){
    make('circle',{cx:x,cy:y,r:radius+3,fill:'rgba(16,69,57,.72)',stroke:meta.color,'stroke-width':1.4},group);
    make('path',{
      d:`M ${(x-radius*.48).toFixed(1)},${y} L ${(x-radius*.1).toFixed(1)},${(y+radius*.38).toFixed(1)} L ${(x+radius*.58).toFixed(1)},${(y-radius*.45).toFixed(1)}`,
      fill:'none',stroke:'#e5fff5','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'
    },group);
  }else if(task.status==='in-progress'){
    make('circle',{cx:x,cy:y,r:radius+5,fill:'none',stroke:meta.color,'stroke-width':1.6,opacity:.72,class:'cv-task-pulse'},group);
    make('circle',{cx:x,cy:y,r:radius+3,fill:'none',stroke:meta.color,'stroke-width':1.5,'stroke-dasharray':'4 5',class:'cv-task-status-ring'},group);
    make('circle',{cx:x,cy:y,r:radius*.72,fill:meta.core,class:'p-core'},group);
  }else if(task.status==='error'){
    make('path',{
      d:`M ${x},${(y-radius-3).toFixed(1)} L ${(x+radius+3).toFixed(1)},${(y-radius*.2).toFixed(1)} L ${(x+radius*.55).toFixed(1)},${(y+radius+3).toFixed(1)} L ${(x-radius*.65).toFixed(1)},${(y+radius*.72).toFixed(1)} L ${(x-radius-3).toFixed(1)},${(y-radius*.3).toFixed(1)} Z`,
      fill:'rgba(104,18,31,.9)',stroke:meta.color,'stroke-width':1.8
    },group);
    const bang=make('text',{x,y:y+4,'text-anchor':'middle','font-size':13,'font-weight':900,fill:'#ffe2e4'},group);
    bang.textContent='!';
  }else{
    make('circle',{cx:x,cy:y,r:radius+3,fill:'rgba(17,24,37,.92)',stroke:meta.color,'stroke-width':1.3,'stroke-dasharray':'2 4'},group);
    make('rect',{x:x-3.8,y:y-1,width:7.6,height:6,rx:1.2,fill:'rgba(151,168,193,.72)'},group);
    make('path',{d:`M ${x-2.6},${y-1} V ${y-3} A 2.6,2.6 0 0 1 ${x+2.6},${y-3} V ${y-1}`,
      fill:'none',stroke:'#d2dbe7','stroke-width':1},group);
  }

  const textX=x+radius+8;
  const nameLimit=Math.max(5,Math.floor((slotWidth-radius-23)/(dense?9:10)));
  const label=make('text',{
    x:textX,y:y-(dense?2:3),'font-size':dense?9.2:10.5,
    style:'paint-order:stroke;stroke:rgba(4,8,15,.96);stroke-width:3px;stroke-linejoin:round'
  },group);
  const idPart=make('tspan',{fill:meta.color,'font-weight':800},label);
  idPart.textContent=task.id;
  const namePart=make('tspan',{fill:'rgba(220,232,243,.9)'},label);
  namePart.textContent=` · ${truncate(task.name,nameLimit)}`;

  const badgeWidth=dense?39:46;
  const badgeHeight=dense?13:15;
  make('rect',{
    x:textX,y:y+4,width:badgeWidth,height:badgeHeight,rx:badgeHeight/2,
    fill:task.status==='done'?'rgba(20,76,63,.92)':
      task.status==='in-progress'?'rgba(91,61,18,.94)':
      task.status==='error'?'rgba(100,22,32,.94)':'rgba(34,44,61,.94)',
    stroke:meta.color,'stroke-width':.8,opacity:.94
  },group);
  const statusText=make('text',{
    x:textX+badgeWidth/2,y:y+4+badgeHeight-(dense?3.3:3.8),
    'text-anchor':'middle','font-size':dense?7.5:8.5,'font-weight':800,fill:meta.color
  },group);
  statusText.textContent=meta.label;
  return group;
}

phases.forEach((phase,index)=>{
  const row=Math.floor(index/columns);
  const column=index%columns;
  const rowCount=Math.min(columns,phases.length-row*columns);
  const rowOffset=(columns-rowCount)*(cellWidth+gapX)/2;
  const x=bounds.x+rowOffset+column*(cellWidth+gapX);
  const y=bounds.y+row*(cellHeight+gapY);
  const status=phaseStatus(phase);
  const meta=STATUS_META[status];
  const phaseDone=phase.tasks.filter(task=>task.status==='done').length;
  const phasePercent=phase.tasks.length?Math.round(phaseDone/phase.tasks.length*100):0;
  const background=make('g',{
    class:`cv-phase-background status-${status}`,
    'data-phase-id':phase.id
  },phaseBacks);
  make('rect',{x:x+2,y:y+2,width:cellWidth-4,height:cellHeight-4,rx:14,
    stroke:meta.color,class:'cv-phase-card-glow'},background);
  make('rect',{x,y,width:cellWidth,height:cellHeight,rx:14,class:'cv-phase-card'},background);
  make('ellipse',{
    cx:x+cellWidth*.55,cy:y+cellHeight*.62,
    rx:Math.max(24,cellWidth*.39),ry:Math.max(18,cellHeight*.26),
    class:'cv-phase-orbit',transform:`rotate(${index%2?9:-7} ${x+cellWidth*.55} ${y+cellHeight*.62})`
  },background);

  const front=make('g',{
    class:`cv-phase status-${status}`,
    'data-phase-id':phase.id,
    'data-phase-name':phase.name,
    'data-progress':phasePercent
  },phaseFronts);
  const phaseTitle=make('text',{
    x:x+14,y:y+23,'font-size':cellHeight<145?10.5:12.5,'font-weight':700,
    fill:'#dfeef8',style:'paint-order:stroke;stroke:rgba(4,8,15,.8);stroke-width:3px'
  },front);
  phaseTitle.textContent=truncate(phase.name,Math.max(8,Math.floor((cellWidth-118)/11)));
  const phaseTitleTooltip=make('title',{},phaseTitle);
  phaseTitleTooltip.textContent=phase.name;
  const phaseStat=make('text',{
    x:x+cellWidth-14,y:y+23,'text-anchor':'end','font-size':10.5,'font-weight':700,fill:meta.color
  },front);
  phaseStat.textContent=`${phaseDone} / ${phase.tasks.length} · ${phasePercent}%`;
  const progressX=x+14;
  const progressY=y+33;
  const progressWidth=cellWidth-28;
  make('rect',{x:progressX,y:progressY,width:progressWidth,height:3,rx:1.5,class:'cv-phase-progress-bg'},front);
  make('rect',{x:progressX,y:progressY,width:(progressWidth*phasePercent/100).toFixed(1),height:3,rx:1.5,
    class:'cv-phase-progress',fill:meta.color},front);

  const contentTop=y+45;
  const contentHeight=Math.max(28,cellHeight-53);
  const minimumSlotWidth=cellWidth>=400?132:cellWidth>=280?118:102;
  const taskColumns=Math.max(1,Math.min(Math.max(1,phase.tasks.length),Math.floor((cellWidth-18)/minimumSlotWidth)));
  const taskRows=Math.max(1,Math.ceil(Math.max(1,phase.tasks.length)/taskColumns));
  const slotWidth=(cellWidth-18)/taskColumns;
  const slotHeight=contentHeight/taskRows;
  const dense=slotHeight<38||slotWidth<116||cellHeight<138;
  phase.tasks.forEach((task,taskIndex)=>{
    const taskColumn=taskIndex%taskColumns;
    const taskRow=Math.floor(taskIndex/taskColumns);
    const taskX=x+12+taskColumn*slotWidth+(dense?8:10);
    const taskY=contentTop+(taskRow+.5)*slotHeight;
    positionsByKey.set(task.key,{x:taskX,y:taskY,phaseId:phase.id});
    if(!positionsById.has(task.id))positionsById.set(task.id,{x:taskX,y:taskY,phaseId:phase.id});
    renderTask(task,taskX,taskY,slotWidth,dense,front);
  });
});

const seenEdges=new Set();
let dependencyCount=0;
tasks.forEach(task=>{
  const target=positionsByKey.get(task.key);
  if(!target)return;
  task.depends.forEach((dependencyId,dependencyIndex)=>{
    const source=positionsById.get(dependencyId);
    if(!source)return;
    const edgeKey=`${dependencyId}\u0000${task.id}`;
    if(seenEdges.has(edgeKey))return;
    seenEdges.add(edgeKey);
    const dx=target.x-source.x;
    const dy=target.y-source.y;
    const distance=Math.max(1,Math.hypot(dx,dy));
    const startX=source.x+dx/distance*12;
    const startY=source.y+dy/distance*12;
    const endX=target.x-dx/distance*14;
    const endY=target.y-dy/distance*14;
    const perpendicularX=-dy/distance;
    const perpendicularY=dx/distance;
    const curve=(source.phaseId===target.phaseId?12:Math.min(46,distance*.10))*
      ((dependencyIndex%2===0)?1:-1);
    const control1X=startX+dx*.36+perpendicularX*curve;
    const control1Y=startY+dy*.18+perpendicularY*curve;
    const control2X=startX+dx*.64+perpendicularX*curve;
    const control2Y=startY+dy*.82+perpendicularY*curve;
    const path=make('path',{
      d:`M ${startX.toFixed(1)},${startY.toFixed(1)} C ${control1X.toFixed(1)},${control1Y.toFixed(1)} ${control2X.toFixed(1)},${control2Y.toFixed(1)} ${endX.toFixed(1)},${endY.toFixed(1)}`,
      class:`cv-dependency status-${task.status}`,
      'data-from':dependencyId,
      'data-to':task.id,
      'marker-end':`url(#cv-arrow-${task.status})`,
      role:'img',
      'aria-label':`${dependencyId} 到 ${task.id}`
    },dependencies);
    const title=make('title',{},path);
    title.textContent=`${dependencyId} → ${task.id}`;
    dependencyCount++;
  });
});
root.setAttribute('data-dependency-count',String(dependencyCount));
window.__CODEVIZ_CONSTELLATION_RENDERED__={
  projectId:asText(payload.projectId),
  phases:phases.length,
  tasks:tasks.length,
  dependencies:dependencyCount,
  stats:{...stats}
};
})();
</script>
<script>
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const far=document.querySelector('.depth-far'),mid=document.querySelector('.depth-mid'),near=document.querySelector('.depth-near');
  addEventListener('pointermove',e=>{
    const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
    far.style.transform=`translate(${x*-5}px,${y*-4}px)`;
    mid.style.translate=`${x*-12}px ${y*-9}px`;
    near.style.transform=`translate(${x*-28}px,${y*-20}px)`;
  },{passive:true});
})();
</script>
</body>
</html>
